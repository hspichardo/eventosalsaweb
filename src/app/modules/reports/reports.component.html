<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <p-toast></p-toast>

            <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center mb-4 gap-3">
                <div class="flex align-items-center gap-2 flex-wrap">
                    <h5 class="m-0">Reporte de registro</h5>
                    <p-dropdown
                        [options]="eventEntities"
                        [(ngModel)]="selectedEvent"
                        optionLabel="name"
                        placeholder="Seleccione un evento"
                        [showClear]="true"
                        styleClass="w-20rem"
                        (onChange)="loadReport()">
                    </p-dropdown>
                </div>

                <div class="flex align-items-center gap-2 flex-wrap">
                    <span class="p-input-icon-left">
                        <i class="pi pi-search"></i>
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." [disabled]="!rows.length" />
                    </span>
                    <button
                        pButton
                        type="button"
                        label="Exportar Excel"
                        icon="pi pi-file-excel"
                        class="p-button-success"
                        [disabled]="!rows.length || loading"
                        (click)="exportXLSX()">
                    </button>
                </div>
            </div>

            <p-table
                #dt
                [value]="rows"
                [columns]="cols"
                responsiveLayout="scroll"
                [paginator]="true"
                [rows]="10"
                [rowsPerPageOptions]="[10, 20, 50]"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} registros"
                [globalFilterFields]="globalFilterFields"
                [loading]="loading"
                [rowHover]="true">

                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0" *ngIf="!selectedEvent">Seleccione un evento para consultar el reporte</h5>
                        <h5 class="m-0" *ngIf="selectedEvent">Evento: {{ selectedEvent.name }}</h5>
                        <span class="block mt-2 md:mt-0" *ngIf="rows.length">{{ rows.length }} registros</span>
                    </div>
                </ng-template>

                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th *ngFor="let col of columns" pSortableColumn="{{col.field}}">
                            {{ col.header }}
                            <p-sortIcon field="{{col.field}}"></p-sortIcon>
                        </th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-row let-columns="columns">
                    <tr>
                        <td *ngFor="let col of columns">
                            <span class="p-column-title">{{ col.header }}</span>
                            {{ row[col.field] }}
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td [attr.colspan]="cols.length || 1" class="text-center">
                            No se encontraron registros
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
