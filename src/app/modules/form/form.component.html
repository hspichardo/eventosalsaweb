<div class="exception-body">
    <div class="exception-topbar">
        <a href="#"  class="logo">
            <img src="assets/layout/images/ecuador-logo.png" alt="ecuador-layout"/>
        </a>
    </div>

    <div class="form-body">
        <div class="grid">
            <div class="col-12">
                <div class="card">
                    <h3>Formulario para registro de persona</h3>
                </div>
            </div>
    
        </div>
    
        <div class="grid">
            <div class="col-12">
                <div class="card card-item">
                    <label htmlFor="name">Nombre Completo</label>
                    <input pInputText id="name" [(ngModel)]="name" />
                    <small class="empty-warning" *ngIf="false">Debe poner un nombre</small>
                </div>
            </div>
    
        </div>
    
        <div class="grid">
            <div class="col-12">
                <div class="card card-item">
                    <label htmlFor="identification">Identificación</label>
                    <input pInputText id="identification" [(ngModel)]="identification" />
                    <small class="empty-warning" *ngIf="false">Debe poner una identificación</small>
                </div>
            </div>
        </div>

        <div class="form-footer">
            <button pButton pRipple label="Enviar" icon="pi pi-check" class="p-button-text"></button>
        </div>
    </div>
    

</div>
